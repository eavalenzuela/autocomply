# CIS Controls v8 -> NIST 800-53 Rev 5 — crosswalk authored for this project.
# ----------------------------------------------------------------------------
# HAND-WRITTEN editorial judgement, not a published crosswalk.
#
# CIS publishes an 800-53 mapping. It is their editorial work under CC BY-NC-ND,
# so it is not reproduced here. These correspondences are ours, formed by reading
# both control sets. They are loaded through POST /api/mappings so they land as
# source="manual" and are audit-logged — the trail should say a human asserted
# these, because one did.
#
# REVIEW BEFORE RELYING ON THEM. A wrong edge here inflates or deflates coverage
# for a framework someone may be certifying against.
#
# strength:
#   direct  -> the Safeguard and control address the same requirement    (partial / high)
#   support -> the control contributes to the outcome without covering it (related / medium)
#
# `partial` rather than `equivalent` throughout: CIS Safeguards are narrower and
# more prescriptive than 800-53 controls, so even a direct correspondence covers
# part of the control, not all of it.
