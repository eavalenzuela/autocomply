safeguards:
  - { code: "1.1", control: "1", title: "Maintain a current, detailed record of every enterprise asset that stores or processes data" }
  - { code: "1.2", control: "1", title: "Have a defined weekly process for dealing with assets found on the network that are not authorised" }
  - { code: "1.3", control: "1", title: "Run an active discovery tool that scans for assets rather than relying on records alone" }
  - { code: "1.4", control: "1", title: "Use DHCP server logging to keep the asset record current" }
  - { code: "1.5", control: "1", title: "Run a passive discovery tool that identifies assets from observed traffic" }
  - { code: "2.1", control: "2", title: "Maintain a current record of software authorised to run in the enterprise" }
  - { code: "2.2", control: "2", title: "Ensure authorised software is still supported by its vendor, and remove or document what is not" }
  - { code: "2.3", control: "2", title: "Have a defined process for removing or authorising software found that is not on the inventory" }
  - { code: "2.4", control: "2", title: "Use tooling to keep the software inventory current automatically" }
  - { code: "2.5", control: "2", title: "Permit only explicitly approved software to execute" }
  - { code: "2.6", control: "2", title: "Permit only explicitly approved code libraries to load" }
  - { code: "2.7", control: "2", title: "Permit only explicitly approved scripts to execute" }
  - { code: "3.1", control: "3", title: "Maintain a documented process governing how data is handled across its lifecycle" }
  - { code: "3.2", control: "3", title: "Maintain a record of the data the enterprise holds, including its sensitivity and location" }
  - { code: "3.3", control: "3", title: "Restrict access to data so that reaching it requires an explicit grant" }
  - { code: "3.4", control: "3", title: "Retain data for defined periods and no longer" }
  - { code: "3.5", control: "3", title: "Dispose of data so that it cannot be recovered afterwards" }
  - { code: "3.6", control: "3", title: "Encrypt data at rest on end-user devices" }
  - { code: "3.7", control: "3", title: "Maintain a scheme that classifies data by sensitivity, and apply it" }
  - { code: "3.8", control: "3", title: "Document how data moves between systems, services and third parties" }
  - { code: "3.9", control: "3", title: "Encrypt data written to removable media" }
  - { code: "3.10", control: "3", title: "Encrypt sensitive data while it is in transit" }
  - { code: "3.11", control: "3", title: "Encrypt sensitive data while it is at rest on servers and storage" }
  - { code: "3.12", control: "3", title: "Separate processing and storage so that sensitivity levels are not co-mingled" }
  - { code: "3.13", control: "3", title: "Deploy tooling that identifies and prevents unauthorised movement of sensitive data" }
  - { code: "3.14", control: "3", title: "Log access to sensitive data so that it can be reviewed afterwards" }
  - { code: "4.1", control: "4", title: "Maintain a documented process for establishing and keeping secure configurations" }
  - { code: "4.2", control: "4", title: "Maintain a documented secure configuration process specific to network infrastructure" }
  - { code: "4.3", control: "4", title: "Lock sessions automatically after a period of inactivity" }
  - { code: "4.4", control: "4", title: "Run and manage a host firewall on servers" }
  - { code: "4.5", control: "4", title: "Run and manage a host firewall on end-user devices" }
  - { code: "4.6", control: "4", title: "Administer assets and software over secure, managed channels" }
  - { code: "4.7", control: "4", title: "Remove, disable or rename default accounts, and change default credentials" }
  - { code: "4.8", control: "4", title: "Remove or disable services, ports and features that are not needed" }
  - { code: "4.9", control: "4", title: "Point assets at DNS resolvers the enterprise controls or trusts" }
  - { code: "4.10", control: "4", title: "Lock portable devices automatically after repeated failed authentication attempts" }
  - { code: "4.11", control: "4", title: "Be able to wipe enterprise data from a portable device remotely" }
  - { code: "4.12", control: "4", title: "Keep enterprise data on mobile devices separated from personal data" }
  - { code: "5.1", control: "5", title: "Maintain a current record of all accounts, including who owns each one" }
  - { code: "5.2", control: "5", title: "Require credentials to be unique per account rather than shared or reused" }
  - { code: "5.3", control: "5", title: "Disable accounts that have gone unused for a defined period" }
  - { code: "5.4", control: "5", title: "Perform administrative work from dedicated admin accounts, not everyday ones" }
  - { code: "5.5", control: "5", title: "Maintain a current record of service accounts and their purpose" }
  - { code: "5.6", control: "5", title: "Manage accounts from a central directory rather than per system" }
  - { code: "6.1", control: "6", title: "Have a defined process for granting access when someone joins or changes role" }
  - { code: "6.2", control: "6", title: "Have a defined process for revoking access promptly when it is no longer needed" }
  - { code: "6.3", control: "6", title: "Require multi-factor authentication for applications exposed to the internet" }
  - { code: "6.4", control: "6", title: "Require multi-factor authentication for remote access to the network" }
  - { code: "6.5", control: "6", title: "Require multi-factor authentication for administrative access" }
  - { code: "6.6", control: "6", title: "Maintain a record of the systems that perform authentication and authorisation" }
  - { code: "6.7", control: "6", title: "Manage authorisation centrally rather than per system" }
  - { code: "6.8", control: "6", title: "Define and enforce access on a role basis, reviewing grants periodically" }
  - { code: "7.1", control: "7", title: "Maintain a documented process for managing vulnerabilities on a defined cycle" }
  - { code: "7.2", control: "7", title: "Maintain a documented process for prioritising and tracking remediation" }
  - { code: "7.3", control: "7", title: "Apply operating system patches automatically on a defined cadence" }
  - { code: "7.4", control: "7", title: "Apply application patches automatically on a defined cadence" }
  - { code: "7.5", control: "7", title: "Scan internal assets for vulnerabilities automatically and regularly" }
  - { code: "7.6", control: "7", title: "Scan internet-facing assets for vulnerabilities automatically and regularly" }
  - { code: "7.7", control: "7", title: "Remediate the vulnerabilities that scanning finds, on a defined timeline" }
  - { code: "8.1", control: "8", title: "Maintain a documented process covering what is logged, where and for how long" }
  - { code: "8.2", control: "8", title: "Collect audit logs from assets and services across the estate" }
  - { code: "8.3", control: "8", title: "Provision enough storage that logs are not lost to capacity limits" }
  - { code: "8.4", control: "8", title: "Synchronise clocks so that events from different sources can be correlated" }
  - { code: "8.5", control: "8", title: "Log enough detail that an event can be reconstructed, not merely noticed" }
  - { code: "8.6", control: "8", title: "Record the DNS lookups assets make" }
  - { code: "8.7", control: "8", title: "Record the web addresses assets request" }
  - { code: "8.8", control: "8", title: "Record the commands executed on assets, not merely that a session occurred" }
  - { code: "8.9", control: "8", title: "Aggregate logs centrally rather than leaving them on originating hosts" }
  - { code: "8.10", control: "8", title: "Retain logs long enough to investigate an intrusion discovered late" }
  - { code: "8.11", control: "8", title: "Review logs on a defined cadence rather than only after an incident" }
  - { code: "8.12", control: "8", title: "Collect logs from service providers who host enterprise data or services" }
  - { code: "9.1", control: "9", title: "Use only browsers and email clients that are still supported by their vendor" }
  - { code: "9.2", control: "9", title: "Filter DNS resolution to block known-malicious domains" }
  - { code: "9.3", control: "9", title: "Filter web requests against URL categories and known-bad destinations" }
  - { code: "9.4", control: "9", title: "Permit only approved browser and email client extensions" }
  - { code: "9.5", control: "9", title: "Publish DMARC records, having deployed SPF and DKIM" }
  - { code: "9.6", control: "9", title: "Block inbound file types that the enterprise has no need to receive" }
  - { code: "9.7", control: "9", title: "Scan inbound mail at the server for malicious content" }
  - { code: "10.1", control: "10", title: "Deploy anti-malware software to assets" }
  - { code: "10.2", control: "10", title: "Update anti-malware signatures automatically" }
  - { code: "10.3", control: "10", title: "Prevent removable media from executing content automatically on insertion" }
  - { code: "10.4", control: "10", title: "Scan removable media for malicious content automatically when connected" }
  - { code: "10.5", control: "10", title: "Enable operating system and application anti-exploitation protections" }
  - { code: "10.6", control: "10", title: "Manage anti-malware software centrally rather than per host" }
  - { code: "10.7", control: "10", title: "Use anti-malware that detects on behaviour, not only on signatures" }
  - { code: "11.1", control: "11", title: "Maintain a documented process for recovering data, with defined objectives" }
  - { code: "11.2", control: "11", title: "Back up data automatically on a defined schedule" }
  - { code: "11.3", control: "11", title: "Protect backups with the same rigour as the data they contain" }
  - { code: "11.4", control: "11", title: "Keep at least one copy of recovery data isolated from the production network" }
  - { code: "11.5", control: "11", title: "Test restoration regularly, so that recovery is known to work rather than assumed" }
  - { code: "12.1", control: "12", title: "Keep network infrastructure patched and on supported versions" }
  - { code: "12.2", control: "12", title: "Design the network so that segmentation and trust boundaries are deliberate" }
  - { code: "12.3", control: "12", title: "Administer network infrastructure over secure, managed channels" }
  - { code: "12.4", control: "12", title: "Maintain current network diagrams, and keep them accurate as the estate changes" }
  - { code: "12.5", control: "12", title: "Centralise network authentication, authorisation and accounting" }
  - { code: "12.6", control: "12", title: "Use protocols that authenticate and encrypt network management traffic" }
  - { code: "12.7", control: "12", title: "Require remote devices to connect through a VPN into enterprise infrastructure" }
  - { code: "12.8", control: "12", title: "Perform administrative work from dedicated devices, separated from general use" }
  - { code: "13.1", control: "13", title: "Aggregate security alerts centrally so that they are seen in one place" }
  - { code: "13.2", control: "13", title: "Deploy host-based intrusion detection on assets" }
  - { code: "13.3", control: "13", title: "Deploy network-based intrusion detection" }
  - { code: "13.4", control: "13", title: "Filter traffic between network segments rather than permitting it by default" }
  - { code: "13.5", control: "13", title: "Control what remote assets may reach, based on their posture" }
  - { code: "13.6", control: "13", title: "Collect network flow records across the estate" }
  - { code: "13.7", control: "13", title: "Deploy host-based intrusion prevention on assets" }
  - { code: "13.8", control: "13", title: "Deploy network-based intrusion prevention" }
  - { code: "13.9", control: "13", title: "Authenticate devices at the network port before granting access" }
  - { code: "13.10", control: "13", title: "Filter traffic at the application layer, not only by port and address" }
  - { code: "13.11", control: "13", title: "Tune alert thresholds so that real events are not lost in noise" }
  - { code: "14.1", control: "14", title: "Run a security awareness programme, refreshed on a defined cadence" }
  - { code: "14.2", control: "14", title: "Train people to recognise social engineering, including phishing" }
  - { code: "14.3", control: "14", title: "Train people on authentication practice, including credential handling and MFA" }
  - { code: "14.4", control: "14", title: "Train people on handling data according to its classification" }
  - { code: "14.5", control: "14", title: "Train people on the ways data is exposed accidentally" }
  - { code: "14.6", control: "14", title: "Train people to recognise a security incident and to report it" }
  - { code: "14.7", control: "14", title: "Train people to notice and report assets that are missing patches or protections" }
  - { code: "14.8", control: "14", title: "Train people on the risks of untrusted networks and unencrypted transmission" }
  - { code: "14.9", control: "14", title: "Provide additional training specific to roles that carry more risk" }
  - { code: "15.1", control: "15", title: "Maintain a record of service providers who hold or process enterprise data" }
  - { code: "15.2", control: "15", title: "Maintain a documented policy governing how service providers are managed" }
  - { code: "15.3", control: "15", title: "Classify service providers by the risk they represent" }
  - { code: "15.4", control: "15", title: "Ensure provider contracts state the security requirements they must meet" }
  - { code: "15.5", control: "15", title: "Assess providers against those requirements before and during the relationship" }
  - { code: "15.6", control: "15", title: "Monitor providers on an ongoing basis, not only at onboarding" }
  - { code: "15.7", control: "15", title: "Decommission providers deliberately, ensuring data is returned or destroyed" }
  - { code: "16.1", control: "16", title: "Maintain a documented secure development process, reviewed periodically" }
  - { code: "16.2", control: "16", title: "Maintain a process for receiving and acting on reported vulnerabilities" }
  - { code: "16.3", control: "16", title: "Analyse the root cause of security defects rather than only the symptom" }
  - { code: "16.4", control: "16", title: "Maintain a record of third-party components used in software the enterprise builds" }
  - { code: "16.5", control: "16", title: "Use third-party components that are current and from trusted sources" }
  - { code: "16.6", control: "16", title: "Maintain a severity rating scheme, and use it to prioritise application defects" }
  - { code: "16.7", control: "16", title: "Harden application infrastructure from standard templates rather than ad hoc" }
  - { code: "16.8", control: "16", title: "Keep production and non-production environments separated" }
  - { code: "16.9", control: "16", title: "Train developers in secure design and secure coding" }
  - { code: "16.10", control: "16", title: "Apply secure design principles when designing application architecture" }
  - { code: "16.11", control: "16", title: "Use vetted, shared components for security functions rather than writing them again" }
  - { code: "16.12", control: "16", title: "Check code for security defects as part of development, not after it" }
  - { code: "16.13", control: "16", title: "Test applications adversarially, at a depth matched to their risk" }
  - { code: "16.14", control: "16", title: "Model threats against applications so that design decisions answer real risks" }
  - { code: "17.1", control: "17", title: "Name the people accountable for handling incidents" }
  - { code: "17.2", control: "17", title: "Maintain current contact details for everyone needed during an incident" }
  - { code: "17.3", control: "17", title: "Maintain a process by which anyone can report a suspected incident" }
  - { code: "17.4", control: "17", title: "Maintain a documented incident response process, reviewed periodically" }
  - { code: "17.5", control: "17", title: "Assign the roles and responsibilities the response process depends on" }
  - { code: "17.6", control: "17", title: "Define how people will communicate during an incident, including out-of-band" }
  - { code: "17.7", control: "17", title: "Exercise the response process regularly rather than first using it in anger" }
  - { code: "17.8", control: "17", title: "Review incidents afterwards and feed what is learned back into the process" }
  - { code: "17.9", control: "17", title: "Define the thresholds at which an event becomes a declared incident" }
  - { code: "18.1", control: "18", title: "Maintain a penetration testing programme with defined scope and cadence" }
  - { code: "18.2", control: "18", title: "Conduct external penetration tests periodically" }
  - { code: "18.3", control: "18", title: "Remediate what penetration testing finds, on a defined timeline" }
  - { code: "18.4", control: "18", title: "Validate that deployed defences actually detect and block what they should" }
  - { code: "18.5", control: "18", title: "Conduct internal penetration tests periodically" }
